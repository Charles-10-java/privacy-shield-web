<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PrivacyShield</title>
    <!-- Modern premium font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
    <div id="device-frame">
        <div id="app" class="app-container">
            <!-- Content rendered dynamically via app.js -->
        </div>
        <nav id="bottom-nav" class="bottom-nav hidden">
            <!-- Tab Menu -->
            <button class="nav-item active" onclick="navigateTab('protect')">
                <ion-icon name="shield-checkmark-outline"></ion-icon>
                <span>Protect</span>
            </button>
            <button class="nav-item" onclick="navigateTab('activity')">
                <ion-icon name="list-outline"></ion-icon>
                <span>Activity</span>
            </button>
            <button class="nav-item" onclick="navigateTab('device')">
                <ion-icon name="hardware-chip-outline"></ion-icon>
                <span>Device</span>
            </button>
            <button class="nav-item" onclick="navigateTab('settings')">
                <ion-icon name="settings-outline"></ion-icon>
                <span>Settings</span>
            </button>
            <button class="nav-item" onclick="navigateTab('profile')">
                <ion-icon name="person-outline"></ion-icon>
                <span>Profile</span>
            </button>
        </nav>
    </div>
    <script src="app.js"></script>
</body>
</html>
